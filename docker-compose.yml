services:
  sotd:
    build: .
    ports:
      - "8080:8080"
    environment:
      TZ: America/Chicago
      DOWNLOAD_DIR: /downloads
      LOG_DIR: /data
      CRON: "0 7 * * *"
      MUSICBRAINZ_ENABLED: "true"
      # Extra lookups for label, catalog number, barcode, genre, composer
      MUSICBRAINZ_DEEP_METADATA: "true"
      # ID3v2 minor version to write; 3 is the safest for NAS media servers
      ID3_VERSION: "3"
      # Optional: email/URL for MusicBrainz API User-Agent
      # MUSICBRAINZ_CONTACT: you@example.com
    volumes:
      # Change this host path to your NAS shared music folder
      - ./downloads:/downloads
      - sotd-data:/data
    restart: unless-stopped

volumes:
  sotd-data:
