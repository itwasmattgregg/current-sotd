services:
  sotd:
    build: .
    ports:
      - "8080:8080"
    environment:
      - TZ=America/Chicago
      - DOWNLOAD_DIR=/downloads
      - LOG_DIR=/data
      - CRON=0 7 * * *
    volumes:
      # Change this host path to your NAS shared music folder
      - ./downloads:/downloads
      - sotd-data:/data
    restart: unless-stopped

volumes:
  sotd-data:
